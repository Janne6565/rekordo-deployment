apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    # Roll the pods automatically when the config map or sealed secrets change.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/janne6565/rekordo-backend:placeholder
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: music-collector-backend-config
          env:
            # Same password as Postgres — one shared sealed secret.
            - name: MC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-collector-db-secret
                  key: POSTGRES_PASSWORD
            # No fallback in application.yml: the app fails to start rather than run
            # on a known signing key.
            - name: MC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: music-collector-jwt-secret
                  key: MC_JWT_SECRET
            # Scoped to this environment's photo bucket only — the staging credentials
            # are refused on the prod bucket and vice versa.
            - name: MC_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: music-collector-storage-secret
                  key: MC_MINIO_ACCESS_KEY
            - name: MC_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: music-collector-storage-secret
                  key: MC_MINIO_SECRET_KEY
            # One OAuth client per environment, so the staging redirect URI can never be
            # registered against the prod client. Marked optional: a provider with blank
            # credentials is simply not offered on the sign-in screen, so an environment
            # without the secret still starts and still works — minus the Google button.
            - name: MC_OAUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: music-collector-oauth-secret
                  key: MC_OAUTH_GOOGLE_CLIENT_ID
                  optional: true
            - name: MC_OAUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: music-collector-oauth-secret
                  key: MC_OAUTH_GOOGLE_CLIENT_SECRET
                  optional: true
            # Discogs is where the physical pressings are — MusicBrainz has none of the
            # four vinyl editions of Fred again..'s "ten days", for instance. Optional, and
            # the app starts without it: anonymous callers still get results, just at 25
            # requests a minute instead of 60 and with every cover image blank. A degraded
            # source, not a reason to refuse to start.
            - name: MC_DISCOGS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: music-collector-discogs-secret
                  key: MC_DISCOGS_TOKEN
                  optional: true
            # Raised from the anonymous 25 only because a token is present; the client
            # paces itself to whatever this says, and Discogs answers 429 rather than
            # queueing, so overstating it turns a slow search into a failed one.
            - name: MC_DISCOGS_REQUESTS_PER_MINUTE
              value: "60"
            # A SEND-scoped mail-service key per environment, so revoking staging's cannot
            # stop prod's reset mail. Optional for the same reason as the OAuth keys:
            # without it reset links are logged rather than sent, which is a degraded
            # feature, not a reason to refuse to start.
            - name: MC_MAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: music-collector-mail-secret
                  key: MC_MAIL_API_KEY
                  optional: true
            # Cloudflare Turnstile, in front of sign-up, sign-in and the two endpoints that
            # send mail to an address the caller typed. One widget covers both environments,
            # so both overlays seal the same pair -- the widget's domain list is what keeps
            # a staging token from being solved anywhere unexpected, and the backend's
            # hostname check is what refuses one that was.
            #
            # Optional, and both halves must arrive together: with neither set the check is
            # simply off and the app starts, which is what keeps prod running until the
            # secret lands. With exactly one set the app refuses to start, on purpose --
            # half-configured would either serve a widget whose tokens cannot be verified or
            # demand tokens no client was told to produce.
            - name: MC_TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: music-collector-turnstile-secret
                  key: MC_TURNSTILE_SITE_KEY
                  optional: true
            - name: MC_TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: music-collector-turnstile-secret
                  key: MC_TURNSTILE_SECRET_KEY
                  optional: true
            # Apple needs four values, not two: it issues no static client secret, so
            # AppleClientSecret signs a short-lived ES256 JWT per request from the .p8 key
            # (MC_OAUTH_APPLE_KEY), keyed by MC_OAUTH_APPLE_KEY_ID, issued by the team and
            # subject to the Services ID. Provider.configured() only checks the id and the
            # key, so a missing team or key id fails at the token exchange, not at startup.
            - name: MC_OAUTH_APPLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: music-collector-oauth-secret
                  key: MC_OAUTH_APPLE_CLIENT_ID
                  optional: true
            - name: MC_OAUTH_APPLE_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: music-collector-oauth-secret
                  key: MC_OAUTH_APPLE_TEAM_ID
                  optional: true
            - name: MC_OAUTH_APPLE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: music-collector-oauth-secret
                  key: MC_OAUTH_APPLE_KEY_ID
                  optional: true
            - name: MC_OAUTH_APPLE_KEY
              valueFrom:
                secretKeyRef:
                  name: music-collector-oauth-secret
                  key: MC_OAUTH_APPLE_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            # Flyway migrations run at startup — allow up to ~2.5 min before failing.
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Writable /tmp on a read-only root FS (Tomcat work dir, java.io.tmpdir).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
