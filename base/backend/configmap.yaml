# Non-secret backend config. Environment-specific values (public base URL) are patched
# in the overlay; secrets live in the sealed secrets instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: music-collector-backend-config
data:
  # Cap the JVM heap — the cluster runs on a single memory-scarce node.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  MC_DB_URL: jdbc:postgresql://postgres:5432/musiccollector
  # The shared cluster MinIO, rather than a StatefulSet per environment: photos are the
  # only object storage this app needs, and two more stateful workloads on a single node
  # is a poor trade for the isolation. The credentials are scoped to this bucket alone.
  MC_MINIO_ENDPOINT: http://minio.minio.svc.cluster.local:9000
  MC_DB_USER: musiccollector
  LOGGING_LEVEL_COM_REKORDO: INFO
  # MusicBrainz requires a descriptive, contactable User-Agent. Anonymous callers hit this
  # proxy, so identify the deployment rather than the end user.
  MC_MUSICBRAINZ_USER_AGENT: "Rekordo/0.1 (https://github.com/Janne6565/rekordo-backend)"
  # --- Telemetry (SigNoz) -------------------------------------------------------------
  # Two exporters with one destination, split by signal:
  #   * spans from the OpenTelemetry Java agent baked into the image, over gRPC on 4317 --
  #     that is what turns an outbound MusicBrainz or Discogs call into something visible;
  #   * metrics from Micrometer's OTLP registry, over HTTP on 4318, so http.server.requests
  #     and the rekordo.* collection gauges keep the names the other Spring services use.
  #
  # Deliberately no OTEL_METRICS_EXPORTER here. The agent and Boot's OpenTelemetry module
  # both read it, so "none" -- meant only to stop the agent publishing a second copy of
  # every JVM metric -- also silences the registry carrying this app's own meters, and
  # nothing reports that it has. The agent is told to stay out of metrics by the
  # otel.metrics.exporter system property in the Dockerfile instead, which Boot does not
  # read.
  OTEL_SERVICE_NAME: rekordo-backend
  OTEL_TRACES_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  # The agent defaults to http/protobuf, so the protocol has to be said out loud or it
  # speaks HTTP at the gRPC port: the collector resets the connection, the agent logs a
  # failed export every few seconds, and no span arrives. It warns about the port once at
  # startup and then carries on, so nothing looks broken from the outside.
  # Destination is Grafana Alloy, which forwards to Grafana Cloud AND, for the duration
  # of the parallel run, on to SigNoz -- so the thirteen SigNoz alert rules that read
  # these series keep firing. An app can only name one OTLP endpoint; the fan-out lives
  # in cluster-deployment/infrastructure/grafana-alloy.yaml, not here.
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-k8s-monitoring-alloy-receiver.observability.svc.cluster.local:4317
  MC_OTLP_METRICS_ENABLED: "true"
  # The per-signal override, and it is not redundant with the property below. Micrometer's
  # OtlpConfig resolves its endpoint from the OTEL_* environment first, so the generic
  # OTEL_EXPORTER_OTLP_ENDPOINT above -- which exists for the agent, and points at the gRPC
  # port -- wins over management.otlp.metrics.export.url and sends the metrics to 4317.
  # They are then posted as HTTP at a gRPC port and quietly go nowhere. The registry says
  # which endpoint it chose in one INFO line at startup, which is the only visible sign.
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://grafana-k8s-monitoring-alloy-receiver.observability.svc.cluster.local:4318/v1/metrics
  MC_OTLP_METRICS_URL: http://grafana-k8s-monitoring-alloy-receiver.observability.svc.cluster.local:4318/v1/metrics
  # A single node with one replica: sampling would only make a quiet service harder to
  # debug, and this app's whole traffic is a rounding error beside the k8s metrics.
  OTEL_TRACES_SAMPLER: always_on
