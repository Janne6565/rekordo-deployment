# Every host the app answers on, one Ingress. Traefik routes by longest prefix: /api hits
# the backend, everything else the web app (same origin, so the browser never sees CORS).
# rekordo.de is the app's home; the jannekeipert.de hosts are what shipped phone builds have
# compiled in, so their /api has to keep answering for as long as those builds are about.
# TLS is issued per host by cert-manager rather than sharing the multi-domain cert, and each
# host keeps a *separate* certificate: adding a new name as a SAN on an existing secret would
# re-issue the cert a live host is already serving, so an ACME failure on the new name could
# take the old one down. www.rekordo.de rides on rekordo.de's certificate; its Ingress, which
# only redirects, is in redirects.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-collector-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - music.jannekeipert.de
      secretName: music-collector-tls
    - hosts:
        - rekordo.jannekeipert.de
      secretName: rekordo-tls
    - hosts:
        - rekordo.de
        - www.rekordo.de
      secretName: rekordo-de-tls
  rules:
    - host: rekordo.de
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: music.jannekeipert.de
      http:
        paths:
          # API first — the backend serves everything under /api/v1/...
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Everything else is the web app.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: rekordo.jannekeipert.de
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
