apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: music-collector-prod
resources:
- ../../base
- ingress.yaml
- sealed-secrets
# CI (music-collector-backend / -frontend) rewrites these tags via
# `kustomize edit set image` and pushes — ArgoCD then auto-syncs.
# Cutting a vX.Y.Z tag in a product repo IS the prod deploy.
# The values below are the bootstrap pins.
# Per-environment bucket, so staging can never write into the prod one.
  # The app's own origin. OAuth redirect URIs are built from it and must match what
  # the provider has registered, and password-reset links point at it — the
  # application.yml default is localhost, which would silently break both.
configMapGenerator:
- behavior: merge
  literals:
  - MC_MINIO_BUCKET=music-collector-photos-prod
  - MC_ENVIRONMENT=prod
  - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=prod
  - MC_PUBLIC_URL=https://rekordo.jannekeipert.de
  - MC_PUSH_ENABLED=true
  name: music-collector-backend-config

  # The deployment references the config map by its plain name.
generatorOptions:
  disableNameSuffixHash: true

images:
- name: ghcr.io/janne6565/rekordo-backend
  newTag: 0.27.0
- name: ghcr.io/janne6565/rekordo-frontend
  newTag: 0.28.6
