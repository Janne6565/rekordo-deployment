# Hosts that only ever send people to https://rekordo.de, keeping the path.
#
# A separate Ingress because a router.middlewares annotation applies to every router its
# Ingress produces: on the main Ingress it would redirect /api too, and /api on the old hosts
# has to keep answering the phone builds that have those hosts compiled in.
#
# No cert-manager annotation here. The certificate for these hosts is requested by the main
# Ingress; a second annotated Ingress naming the same secret would make cert-manager fight
# itself over one Certificate.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-rekordo-de
spec:
  redirectRegex:
    regex: ^https?://[^/]+(.*)$
    replacement: https://rekordo.de${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rekordo-redirects
  annotations:
    # The namespace is part of the reference, which is why this lives in the overlay.
    traefik.ingress.kubernetes.io/router.middlewares: music-collector-prod-redirect-to-rekordo-de@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.rekordo.de
      secretName: rekordo-de-tls
  rules:
    - host: www.rekordo.de
      http:
        paths:
          # Never reached: the middleware answers first. An Ingress path needs a backend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
