apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: music-collector-staging
resources:
- ../../base
- ingress.yaml
- sealed-secrets
# CI (music-collector-backend / -frontend) rewrites these tags via
# `kustomize edit set image` and pushes — ArgoCD then auto-syncs.
# Merging to main in a product repo IS the staging deploy.
# The values below are the bootstrap pins.
# Per-environment bucket, so staging can never write into the prod one.
  # The app's own origin. OAuth redirect URIs are built from it and must match what
  # the provider has registered, and password-reset links point at it — the
  # application.yml default is localhost, which would silently break both.
configMapGenerator:
- behavior: merge
  literals:
  - MC_MINIO_BUCKET=music-collector-photos-staging
  - MC_ENVIRONMENT=staging
  - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=staging
  - MC_PUBLIC_URL=https://rekordo-staging.jannekeipert.de
  # Staging refuses outright from the start. No shipped phone build is signed into it, so
  # there is nothing to wait for -- and it is the only place the action and hostname
  # checks can be exercised against real keys before prod comes to rely on them.
  - MC_TURNSTILE_ENFORCE=true
  name: music-collector-backend-config

  # The deployment references the config map by its plain name.
generatorOptions:
  disableNameSuffixHash: true

images:
- name: ghcr.io/janne6565/rekordo-backend
  newTag: main-fa814ed
- name: ghcr.io/janne6565/rekordo-frontend
  newTag: main-fdd8208
