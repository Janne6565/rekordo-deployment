# Staging for Rekordo.
#
# CI (music-collector-backend / -frontend) rewrites the image tags at the bottom via
# `kustomize edit set image` and pushes -- ArgoCD then auto-syncs. Merging to main in a
# product repo IS the staging deploy; the tags below are only the bootstrap pins.
#
# That same rewrite is why the config values live in backend.env: it hoists comments out
# of a `literals:` list. Keep explanations there, or at the top of this file where there
# is no node above them to move to.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: music-collector-staging
resources:
- ../../base
- ingress.yaml
- redirects.yaml
- sealed-secrets
# Values live in backend.env, each beside the comment that explains it. They were
# `literals:` here until `kustomize edit set image` -- which CI runs on every deploy --
# hoisted their comments out of the list one by one.
configMapGenerator:
- behavior: merge
  envs:
  - backend.env
  name: music-collector-backend-config

# The deployment references the config map by its plain name.
generatorOptions:
  disableNameSuffixHash: true

images:
- name: ghcr.io/janne6565/rekordo-backend
  newTag: main-6ef8327
- name: ghcr.io/janne6565/rekordo-frontend
  newTag: main-195728a
