# Every route the app is actually served on, one Ingress. Traefik routes by longest prefix:
# /api hits the backend, everything else the web app (same origin, so the browser never sees
# CORS).
#
# staging.rekordo.de is the app's home. The jannekeipert.de hosts keep exactly what a phone
# build pointed at them calls: /api, and the Turnstile page the app's webview loads from the
# host. Everything else on them is redirected by redirects.yaml -- which never takes these
# paths, because Traefik prefers the longer rule.
#
# TLS is issued per host by cert-manager rather than sharing the multi-domain cert, and each
# host keeps a *separate* certificate: adding a new name as a SAN on an existing secret would
# re-issue the cert a live host is already serving, so an ACME failure on the new name could
# take the old one down. The certificates are all requested here, including those for hosts
# whose only route is in redirects.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-collector-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Applies to every router this Ingress produces -- the web app and /api alike. The
    # namespace is part of the reference, which is why it is set per overlay rather than in
    # the base beside the Middleware itself.
    traefik.ingress.kubernetes.io/router.middlewares: music-collector-staging-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - music-staging.jannekeipert.de
      secretName: music-collector-tls
    - hosts:
        - rekordo-staging.jannekeipert.de
      secretName: rekordo-tls
    - hosts:
        - staging.rekordo.de
      secretName: rekordo-de-tls
  rules:
    - host: staging.rekordo.de
      http:
        paths:
          # API first — the backend serves everything under /api/v1/...
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Everything else is the web app.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: rekordo-staging.jannekeipert.de
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /turnstile.html
            pathType: Exact
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /turnstile.js
            pathType: Exact
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: music-staging.jannekeipert.de
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
