# Two hosts during the Music Collector -> Rekordo rename, one Ingress. Traefik routes by
# longest prefix: /api hits the backend, everything else the web app (same origin, so the
# browser never sees CORS).
# TLS is issued per host by cert-manager rather than sharing the multi-domain cert. The two
# hosts deliberately keep *separate* certificates: adding the new name as a SAN on the
# existing secret would re-issue the cert the live host is already serving, so an ACME
# failure during the rename could take music-staging.jannekeipert.de down. The old host and its cert come
# out once the rename is finished -- see the deployment README.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-collector-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Applies to every router this Ingress produces -- the web app and /api alike. The
    # namespace is part of the reference, which is why it is set per overlay rather than in
    # the base beside the Middleware itself.
    traefik.ingress.kubernetes.io/router.middlewares: music-collector-staging-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - music-staging.jannekeipert.de
      secretName: music-collector-tls
    - hosts:
        - rekordo-staging.jannekeipert.de
      secretName: rekordo-tls
  rules:
    - host: music-staging.jannekeipert.de
      http:
        paths:
          # API first — the backend serves everything under /api/v1/...
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Everything else is the web app.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: rekordo-staging.jannekeipert.de
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
